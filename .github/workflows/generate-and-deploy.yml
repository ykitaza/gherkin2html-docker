name: Generate LivingDoc and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # masterブランチも追加
    # paths制限を一時的に削除
    # paths:
    #  - "features/**"
    #  - ".github/workflows/generate-and-deploy.yml"
  # 手動実行も可能に
  workflow_dispatch:

jobs:
  # ジョブIDを明示的に設定
  build:
    runs-on: ubuntu-latest
    name: Build HTML Documentation

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # LivingDocのDockerイメージをビルド
      - name: Build LivingDoc Docker Image
        run: |
          cd docker/livingdoc
          docker build -t livingdoc-generator .

      # HTMLを生成
      - name: Generate HTML Documentation
        run: |
          mkdir -p html-output
          docker run --rm \
            -v ${{ github.workspace }}/features:/app/features:ro \
            -v ${{ github.workspace }}/html-output:/app/html-output \
            livingdoc-generator \
            livingdoc feature-folder /app/features \
            --output /app/html-output \
            --title "BDD Living Documentation"

      # 代替方法: artifactのアップロードをスクリプトで直接実行
      - name: Archive production artifacts
        run: |
          tar -czvf artifact.tar.gz html-output/

      # GitHub Actionsの組み込み機能を使ってartifactを保存
      - name: Store artifact
        uses: actions/upload-artifact@v2
        with:
          name: github-pages
          path: artifact.tar.gz
          retention-days: 1

  # デプロイジョブを分離
  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages

    # GitHub Pagesのための環境設定
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # GitHub Pagesデプロイ用の設定
      - name: Setup Pages
        uses: actions/configure-pages@v3
        with:
          enablement: true # GitHub Pagesを明示的に有効化

      # アーティファクトをダウンロード
      - name: Download artifact
        uses: actions/download-artifact@v2
        with:
          name: github-pages

      # 解凍
      - name: Extract artifact
        run: |
          tar -xzvf artifact.tar.gz

      # 手動でアップロード
      - name: Upload to GitHub Pages
        uses: actions/deploy-pages@v3

permissions:
  contents: read
  pages: write
  id-token: write
